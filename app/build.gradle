plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { value -> value != null && !value.trim().isEmpty() }
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseTaskRequested && !hasReleaseSigning) {
    throw new GradleException('Release signing is not configured.')
}

android {
    namespace 'com.neo.ezaccounting'
    compileSdk 35
    defaultConfig {
        applicationId 'com.neo.ezaccounting'
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName '1.7.0'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) { signingConfig signingConfigs.release }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        sizeBenchmark {
            initWith release
            signingConfig null
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.7.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    constraints {
        implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.20'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.20'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.20'
    }
    testImplementation 'junit:junit:4.13.2'
}

def maxApkSizeBytes = providers.gradleProperty('ledgerly.maxApkSizeBytes')
        .map { it.toLong() }
        .getOrElse(2300000L)

tasks.register('checkSizeBenchmarkApk') {
    dependsOn 'assembleSizeBenchmark'
    doLast {
        def outputDir = file("$buildDir/outputs/apk/sizeBenchmark")
        def apks = fileTree(outputDir).matching { include '*.apk' }.files
        if (apks.size() != 1) {
            throw new GradleException("Expected exactly one size benchmark APK in ${outputDir}, found ${apks.size()}.")
        }
        def apk = apks.first()
        def actualBytes = apk.length()
        logger.lifecycle("Size benchmark APK: ${apk.name} = ${actualBytes} bytes; limit = ${maxApkSizeBytes} bytes")
        if (actualBytes > maxApkSizeBytes) {
            throw new GradleException("APK size regression: ${actualBytes} bytes exceeds ${maxApkSizeBytes} bytes.")
        }
    }
}
